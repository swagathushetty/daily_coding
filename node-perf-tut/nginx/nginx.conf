# ============================================================================
# nginx — deliberately minimal. Tasks 14–17 live HERE.
# Reload after every change:  docker compose exec nginx nginx -s reload
# ============================================================================

events {}

http {
  include /etc/nginx/mime.types;

  # ==========================================================================
  # 📝 TASK 14 — Reverse proxy + load balancing
  # ==========================================================================
  # ❌ CURRENT PROBLEM: this proxies to ONE Node process (port 3000). After
  #    Task 13 you'll run instances on 3000 AND 3001 — half your capacity
  #    sits idle behind this config.
  # ✅ YOUR TASK:
  #    1. Add an upstream block:
  #         upstream app {
  #           least_conn;                     # try round-robin (default) too
  #           server host.docker.internal:3000 max_fails=3 fail_timeout=10s;
  #           server host.docker.internal:3001 max_fails=3 fail_timeout=10s;
  #         }
  #       and change proxy_pass to http://app;
  #    2. Add a GET /whoami endpoint in Node returning process.pid + port,
  #       curl localhost:8080/whoami repeatedly → alternating instances.
  #    3. Kill one instance → nginx routes around it (max_fails). Bring it
  #       back → traffic returns. THAT's passive health checking.
  # ==========================================================================

  # ==========================================================================
  # 📝 TASK 15 — Compression: whose job is it?
  # ==========================================================================
  # ❌ PROBLEM: responses ship uncompressed (curl -H 'Accept-Encoding: gzip'
  #    -sI localhost:8080/products | grep -i encoding → nothing).
  # ✅ YOUR TASK — measure BOTH placements, keep the winner:
  #    a) Node: app.use(compression()) in server.js → load test /products.
  #    b) nginx: here —
  #         gzip on;
  #         gzip_types application/json text/csv;
  #         gzip_min_length 1024;      # don't compress tiny payloads — why?
  #         gzip_comp_level 5;         # 9 is rarely worth the CPU — verify!
  #       (remove the Node middleware, re-run the same load test)
  #    Compression is CPU work: in Node it competes with your event loop; in
  #    nginx it doesn't. Keep (b), and be able to SAY that tradeoff.
  # ==========================================================================

  # ==========================================================================
  # 📝 TASK 16 — Rate limiting at the edge
  # ==========================================================================
  # ✅ YOUR TASK: protect POST /auth/login from brute force:
  #      limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
  #    then inside the server block:
  #      location /auth/login { limit_req zone=login burst=3 nodelay; proxy_pass ...; }
  #    Hammer it (load/README.md) → expect 503s after the burst.
  #    🤔 DISCUSS: what does per-IP limiting miss? (shared NATs, distributed
  #    attacks) Where would you ALSO limit? (app layer per-account — Redis,
  #    so it's shared across instances)
  # ==========================================================================

  # ==========================================================================
  # 📝 TASK 17 — Static files belong to nginx
  # ==========================================================================
  # ❌ PROBLEM: Node serves /public/logo.svg via express.static — measure it.
  # ✅ YOUR TASK: serve it here instead:
  #      location /public/ { root /var/www; expires 7d; }
  #    (docker-compose already mounts ./public). Load test both. Node should
  #    never spend event-loop time shoveling static bytes in production.
  # ==========================================================================

  server {
    listen 80;

    location / {
      proxy_pass http://host.docker.internal:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Request-Id $request_id;

      # ======================================================================
      # 📝 TASK 18b (do with Task 18) — the proxy_buffering gotcha
      # ======================================================================
      # After you build the streaming CSV export (Task 18), download it via
      # nginx (localhost:8080/export/orders.csv) and watch: first byte takes
      # AGES. nginx BUFFERS proxied responses by default — your beautiful
      # stream sits in nginx's buffer. Fix options (try both):
      #   a) here:  proxy_buffering off;   (for this location)
      #   b) from Node per-response: res.setHeader('X-Accel-Buffering', 'no')
      # 🤔 DISCUSS: why does nginx buffer by default? (shields slow clients
      # from occupying your app server — turning it off is a targeted choice
      # for streaming endpoints, not a global one)
      # ======================================================================

      # ======================================================================
      # 📝 TASK 23b (do with Task 23) — WebSockets through a proxy
      # ======================================================================
      # WS connections through nginx fail until the upgrade handshake is
      # forwarded. Every engineer hits this once:
      #   proxy_http_version 1.1;
      #   proxy_set_header Upgrade $http_upgrade;
      #   proxy_set_header Connection "upgrade";
      #   proxy_read_timeout 300s;    # idle WS gets cut at 60s otherwise —
      #                               # this is why heartbeats exist (Task 23)
      # ======================================================================
    }
  }
}
