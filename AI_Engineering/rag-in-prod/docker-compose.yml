# Postgres with the pgvector extension (port 5433 to avoid clashing with the
# other courses' Postgres on 5432).
#   docker compose up -d
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports: ['5433:5432']
    volumes: ['ragpg:/var/lib/postgresql/data']

  # 📝 TASK 11 (Observability): add Langfuse here when you reach it, e.g.
  #   langfuse:
  #     image: langfuse/langfuse:latest
  #     ... (needs its own postgres) — see langfuse docs.

volumes:
  ragpg:
