server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: catalog
          uri: http://localhost:8081
          predicates:
            - Path=/products/**
        # 📝 TIER 3 TASK: add the order route.
        # - id: order
        #   uri: http://localhost:8082
        #   predicates:
        #     - Path=/orders/**
        #
        # Note: payment (8083) and notification (8084) are deliberately NOT
        # routed — they're internal services, not part of the public API.
        # 📝 TIER 3: once you add service discovery, replace hard-coded uris
        # with lb://catalog-service style load-balanced URIs.

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
