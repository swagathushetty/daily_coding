# ============================================================================
# SwiftCart microservices — infrastructure + (optional) containerized services.
#
# DEV MODE (recommended while learning): run ONLY the infra here, and run each
# Spring service on your host with `./mvnw -pl services/<name> spring-boot:run`.
# Faster restarts, easy debugging, and you toggle exactly the tier you're on.
#     docker compose up -d                 # infra only (postgres/redis/kafka/jaeger)
#
# FULL MODE (later, or to see it all run containerized):
#     docker compose --profile full up -d --build
#
# 📝 STRUCTURE NOTE: right now there is ONE postgres with ONE shared database —
# the "shared database" ANTI-PATTERN on purpose (Newman Ch 3/4). Tier 4's task
# is to give each service its OWN database. You will edit this file then.
# ============================================================================
services:
  # ---- infra (always started) ---------------------------------------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: swift
      POSTGRES_PASSWORD: swift
      POSTGRES_DB: swiftcart          # 🐛 tier 4: one DB shared by all services
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']

  kafka:
    image: bitnami/kafka:3.7
    ports: ['9092:9092']
    environment:
      KAFKA_CFG_NODE_ID: '0'
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # advertised as localhost so HOST-run services (dev mode) can connect.
      # (For FULL containerized mode you'd add a second listener on kafka:9092.)
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      ALLOW_PLAINTEXT_LISTENER: 'yes'

  jaeger:
    image: jaegertracing/all-in-one:1.60
    ports:
      - '16686:16686'   # Jaeger UI  → http://localhost:16686 (tier 7)
      - '4317:4317'     # OTLP gRPC
      - '4318:4318'     # OTLP HTTP
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'

  # ---- services (FULL mode only: `--profile full`) ------------------------
  # In dev mode you run these with mvnw instead. Each has its own Dockerfile.
  # build context is the REPO ROOT (.) so the multi-module build can see the
  # parent pom + Maven wrapper; the Dockerfile path selects the module.
  catalog-service:
    profiles: ['full']
    build: { context: ., dockerfile: services/catalog-service/Dockerfile }
    ports: ['8081:8081']
    depends_on: [postgres, kafka]
  order-service:
    profiles: ['full']
    build: { context: ., dockerfile: services/order-service/Dockerfile }
    ports: ['8082:8082']
    depends_on: [postgres, kafka, catalog-service, payment-service]
  payment-service:
    profiles: ['full']
    build: { context: ., dockerfile: services/payment-service/Dockerfile }
    ports: ['8083:8083']
    depends_on: [postgres, kafka]
  notification-service:
    profiles: ['full']
    build: { context: ., dockerfile: services/notification-service/Dockerfile }
    ports: ['8084:8084']
    depends_on: [kafka]
  gateway:
    profiles: ['full']
    build: { context: ., dockerfile: services/gateway/Dockerfile }
    ports: ['8080:8080']
    depends_on: [catalog-service, order-service]

volumes:
  pgdata:
